[package]
name = "loop-bus"
version = "0.1.0"
edition = "2024"
publish = false
description = "The loop bus: Loop's typed events as JSON lines over a Unix socket, and the hub that repeats them"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "sync", "time", "signal"] }
